<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What If · ACUMEN</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header id="nav" class="nav"></header><main class="page"><div class="container"><div class="eyebrow">04 / SCENARIO LAB</div><h1>What If</h1><p class="lead">Explore a plausible academic trajectory under a specific choice. This is scenario analysis, not prophecy.</p><div class="notice" style="margin:22px 0"><b>One thing to remember:</b> this explores possibilities and trade-offs. It does not predict what will happen.</div><form id="sim" class="card formgrid"><div class="field full"><label>Scenario</label><textarea name="scenario" required placeholder="What choice or environment do you want to explore?"></textarea></div><div class="field"><label>Academic tier</label><select name="tier"><option>High School</option><option>University</option><option>Postgraduate</option></select></div><div class="field"><label>Environment</label><select name="env"><option>Competitive academic environment</option><option>Independent study</option><option>Project-heavy technical environment</option><option>Collaborative classroom</option></select></div><div class="full"><button class="btn primary" type="submit">Run the scenario</button></div></form><div id="out" style="margin-top:22px"></div></div></main><footer id="footer" class="footer"></footer><div id="toast" class="toast"></div><script src="/assets/app.js"></script></body></html>
