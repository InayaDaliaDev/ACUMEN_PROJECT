<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neural Roadmap · ACUMEN</title><link rel="stylesheet" href="/assets/styles.css"></head><body><header id="nav" class="nav"></header><main class="page"><div class="container"><div class="eyebrow">07 / EXECUTION ENGINE</div><h1>Neural Roadmap</h1><p class="lead">A short, constraint-aware plan. Your actual available hours matter more than your fantasy productivity schedule.</p><form id="plan" class="card formgrid"><div class="field"><label>Natural rhythm</label><select name="chronotype"><option>Morning person</option><option>Night owl</option><option>Variable day to day</option></select></div><div class="field"><label>Hours per day</label><input name="daily_hours" type="number" min="1" max="10" value="3"></div><div class="field"><label>Plan length</label><select name="plan_length"><option>3</option><option selected>5</option><option>7</option></select></div><div class="field"><label>Break style</label><select name="break_style"><option>Short, frequent breaks</option><option>Long, spaced breaks</option><option>No strong preference</option></select></div><div class="field"><label>Energy after demanding work</label><select name="energy_note"><option>Still energized</option><option>Need a real break</option><option>Depends on topic</option></select></div><div class="field full"><label>Available slots</label><div style="display:flex;gap:14px;flex-wrap:wrap"><label><input type="checkbox" name="slots" value="Early morning"> Early morning</label><label><input type="checkbox" name="slots" value="Mid-morning"> Mid-morning</label><label><input type="checkbox" name="slots" value="Afternoon"> Afternoon</label><label><input type="checkbox" name="slots" value="Evening"> Evening</label><label><input type="checkbox" name="slots" value="Late night"> Late night</label></div></div><div class="field full"><label>Tasks</label><textarea name="tasks" placeholder="One task per line..."></textarea></div><div class="field"><label>Deadline</label><input name="deadline" placeholder="Optional"></div><div class="field"><label>Fixed constraints</label><input name="constraints" placeholder="Classes, commute, training..."></div><div class="full"><button class="btn primary">Generate roadmap →</button></div></form><div id="planout" style="margin-top:24px"></div></div></main><footer id="footer" class="footer"></footer><div id="toast" class="toast"></div><script src="/assets/app.js"></script></body></html>
